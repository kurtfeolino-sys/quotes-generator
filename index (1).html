<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A daily travel quote generator inspired by Goodreads travel quotes." />
  <title>Daily Travel Quote</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="hero-card" aria-labelledby="app-title">
      <div class="eyebrow">Goodreads Travel Quotes</div>
      <h1 id="app-title">A different travel quote every day</h1>
      <p class="subtitle">
        Open this page any day and it will show a new quote from the travel collection.
      </p>

      <article class="quote-card" aria-live="polite">
        <p class="quote-mark" aria-hidden="true">“</p>
        <p class="quote-text" id="quoteText"></p>
        <p class="quote-author" id="quoteAuthor"></p>
      </article>

      <div class="meta-row">
        <span id="quoteDate"></span>
        <span class="dot" aria-hidden="true">•</span>
        <span id="quoteIndex"></span>
      </div>
    </section>
  </main>

  <script>
    const quotes = [
      {
        text: "Not all those who wander are lost.",
        author: "J.R.R. Tolkien"
      },
      {
        text: "The journey of a thousand miles begins with a single step.",
        author: "Lao Tzu"
      },
      {
        text: "To travel is to live.",
        author: "Hans Christian Andersen"
      }
    ];

    function getDaySeed(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return Number(`${year}${month}${day}`);
    }

    function renderQuote() {
      const today = new Date();
      const seed = getDaySeed(today);
      const index = seed % quotes.length;
      const quote = quotes[index];

      document.getElementById('quoteText').textContent = quote.text;
      document.getElementById('quoteAuthor').textContent = `— ${quote.author}`;
      document.getElementById('quoteDate').textContent = today.toLocaleDateString(undefined, {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
      document.getElementById('quoteIndex').textContent = `Quote ${index + 1} of ${quotes.length}`;
    }

    renderQuote();
  </script>
</body>
</html>
